org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
systemProp.jdk.tls.disabledAlgorithms=

# ── 原生工具链版本：全局唯一来源 ──
#
# 之前这两个版本是"隐式"的：NDK 版本根本没写，AGP 9.4.0 就用自己的
# 硬编码默认值 28.2.13676358（取自 AGP 内部常量），CMake 版本则散落在
# app / workspace 两个模块的 externalNativeBuild.cmake.version 里。
#
# 后果是每次 CI 都要现下约 722MB 的 android-ndk-r28c-linux.zip。这一步
# 发生在 Gradle 任务内部，既没有重试也没有缓存，下载被截断就直接报：
#
#     Failed to install the following SDK components: ndk;28.2.13676358
#     java.io.IOException: Error reading Zip content from a SeekableByteChannel
#
# Build APK 因此偶发失败，且失败点埋在编译输出中间，很难看出是下载问题。
#
# 现在改成显式声明：模块读这里设 ndkVersion，CI 的预装步骤也读这里取版本号，
# 两边永远一致，不会出现"预装了 A、AGP 却要 B、于是又去下载"的错位。
#
# 改动须知：
#   1. 升级 AGP 后若提示 NDK 版本不匹配，改这里的值，CI 会自动跟随；
#   2. CMake 版本必须与各模块 CMakeLists.txt 的 cmake_minimum_required 兼容；
#   3. 只改这里，不要去模块里单独写死版本号。
rikkahub.ndkVersion=28.2.13676358
rikkahub.cmakeVersion=3.22.1

# 禁止 Gradle 自动下载 JDK 工具链。
#
# 起因：仓库里曾有一份 gradle/gradle-daemon-jvm.properties，
# 里面写着 toolchainVendor=JETBRAINS、toolchainVersion=21，
# 强制守护进程去 foojay 下 JetBrains 的 JDK。那个下载源最近一直
# 返回 400 Bad Request，于是 Build APK 连续失败，每次二三十秒就挂，
# 连编译都没开始。
#
# 那份文件已删除（CI 用 setup-java 装的 Temurin 21 就够，
# 本地同理）。这里再加一道闸：即使将来又有人生成出那份文件，
# Gradle 也不会去下载——它只使用运行自己的那个 JDK。
#
# 构建环境从此只依赖「跑 Gradle 的那个 Java」，
# 不受第三方下载源可用性的影响。
org.gradle.java.installations.auto-download=false
