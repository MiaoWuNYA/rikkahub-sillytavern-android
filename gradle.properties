org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
systemProp.jdk.tls.disabledAlgorithms=

# 禁止 Gradle 自动下载 JDK 工具链。
#
# CI 里已经用 setup-java 装了 Temurin 21，但某个插件会请求
# vendor=JetBrains 的工具链，Gradle 于是去 foojay 下载——而那个源
# 最近一直返回 400 Bad Request，构建在解析工具链阶段就挂了
# （表现为 20 多秒失败，连编译都没开始）。
#
# 关掉自动下载后，Gradle 直接用当前运行它的那个 JDK，
# 也就是 CI 装好的 Temurin 21，本地同理。构建环境从此只依赖
# 「跑 Gradle 的那个 Java」，不受第三方下载源可用性影响。
org.gradle.java.installations.auto-download=false
