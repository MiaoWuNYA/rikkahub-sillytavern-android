<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RikkaHub 聊天</title>
<style>
  /* 变量命名与 frontend-card 一致，主题由 Kotlin 侧 setTheme / setAppearance 覆盖。
     数值全部取自原生消息区规格（ChatList / ChatMessage / ChainOfThought / HighlightCodeBlock）。 */
  :root {
    --md-primary: #6750A4;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #EADDFF;
    --md-on-primary-container: #21005D;
    --md-secondary: #625B71;
    --md-surface: #FEF7FF;
    --md-surface-container: #F3EDF7;
    --md-surface-container-high: #ECE6F0;
    --md-surface-container-highest: #E6E0E9;
    --md-surface-container-low: #F7F2FA;
    --md-on-surface: #1D1B20;
    --md-on-surface-variant: #49454F;
    --md-outline-variant: #CAC4D0;
    --md-error: #B3261E;
    --md-secondary-container: #E8DEF8;
    --md-on-secondary-container: #1D192B;

    /* 列表骨架：ChatList contentPadding 16dp，底部另加 32dp，项间距 12dp */
    --page-padding: 16px;
    --list-tail: 32px;
    --row-bottom: 12px;
    --row-gap: 4px;          /* ChatMessage Column spacedBy(4.dp) */
    --avatar-size: 28px;     /* AVATAR_BASE_SIZE */
    /* MaterialShapes.Cookie6Sided：六个凸角 + 六个内凹边 */
    --avatar-shape: polygon(50% 0%, 70.5% 14.5%, 93.3% 25%, 91% 50%, 93.3% 75%, 70.5% 85.5%, 50% 100%, 29.5% 85.5%, 6.7% 75%, 9% 50%, 6.7% 25%, 29.5% 14.5%);
    --avatar-gap-user: 8px;
    --avatar-gap-ai: 6px;

    /* 气泡：四角同值 RoundedCornerShape(bubbleCornerRadius)，内边距 12×8（8dp 外框 + MarkdownBlock 4dp 水平） */
    --bubble-radius: 16px;
    --bubble-pad-x: 12px;
    --bubble-pad-y: 8px;

    /* 正文：bodyLarge 16sp/24sp × fontSizeRatio */
    --base-font: 16px;
    --base-line: 24px;
    --font-scale: 1;
    --block-gap: calc(var(--base-font) * var(--font-scale));

    /* 思考/工具卡片：ChainOfThought 圆角 20dp、内边距 12×4dp、内容缩进 32dp */
    --think-radius: 20px;
    --think-pad-x: 12px;
    --think-pad-y: 4px;
    --think-indent: 32px;
    --think-preview: 100px;

    --md-inline-code-radius: 6px;
    --md-code-radius: 12px;
    --md-quote-accent: 3px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    overflow: hidden;
    background: var(--md-surface);
    color: var(--md-on-surface);
    word-break: break-word;
    overscroll-behavior: none;
  }
  /* 唯一滚动容器：body/html 不滚，避免 Android WebView 里滚动手势落空 */
  #scroller {
    position: fixed; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    touch-action: pan-y;
    background-color: var(--chat-bg, transparent);
    background-image: var(--chat-bg-image, none);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  /* 与原生 ChatList 的 contentPadding 同规格：左右 16dp、顶 16dp + 标题栏、底 48dp + 输入栏 */
  #list {
    padding: calc(var(--safe-top, 0px) + var(--page-padding)) var(--page-padding)
             calc(var(--safe-bottom, 0px) + var(--page-padding) + var(--list-tail));
  }
  body {
    font-family: var(--chat-font, -apple-system, "Noto Sans CJK SC", "Source Han Sans SC", Roboto, sans-serif);
    font-size: calc(var(--base-font) * var(--font-scale));
    line-height: calc(var(--base-line) * var(--font-scale));
  }
  body[data-font="serif"] { --chat-font: Georgia, "Noto Serif CJK SC", "Songti SC", serif; }
  body[data-font="monospace"] { --chat-font: ui-monospace, "Noto Sans Mono CJK SC", monospace; }
  body[data-font="cursive"] { --chat-font: "Segoe Script", "Comic Sans MS", cursive; }
  body.solid-text-color { color: var(--text-color); }
  body.solid-text-color .head-name, body.solid-text-color .time { color: var(--text-color); }

  /* —— 消息行：原生是 Column(fillMaxWidth) + spacedBy(4dp)，头行与内容块上下堆叠 —— */
  .row { display: flex; flex-direction: column; gap: var(--row-gap); width: 100%; margin-bottom: var(--row-bottom); }
  .row.user { align-items: flex-end; }
  .row.ai { align-items: flex-start; }
  .head {
    display: flex; align-items: center; gap: var(--avatar-gap-ai);
    min-height: var(--avatar-size); margin-bottom: var(--row-gap);
    max-width: 100%;
  }
  .row.user .head { flex-direction: row-reverse; gap: var(--avatar-gap-user); }
  .head[hidden] { display: none; }
  .head-name {
    font-size: 14px; line-height: 20px; font-weight: 600;
    color: var(--md-on-surface);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .head-name[hidden] { display: none; }
  .avatar {
    flex: 0 0 var(--avatar-size); width: var(--avatar-size); height: var(--avatar-size);
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container);
    display: flex; align-items: center; justify-content: center;
    /* 原生 TextAvatar 用 autoSize 把首字放大到填满，这里按头像尺寸等比给 */
    font-size: calc(var(--avatar-size) * .78); font-weight: 600; line-height: .8;
    overflow: hidden; position: relative;
    -webkit-clip-path: var(--avatar-shape); clip-path: var(--avatar-shape);
  }
  .avatar[hidden] { display: none; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 原生 Avatar.Dummy 是按名字哈希定色相的线性渐变 */
  .avatar[data-kind="dummy"] { background: linear-gradient(135deg, var(--avatar-from), var(--avatar-to)); }
  .avatar[data-kind="emoji"] { padding: 5px; box-sizing: border-box; font-size: calc(var(--avatar-size) - 10px); }
  /* 原生 AutoAIIcon 的 Surface 是 24dp，内缩 4dp 画图 */
  .avatar[data-kind="svg"] { flex: 0 0 24px; width: 24px; height: 24px; padding: 4px; box-sizing: border-box; color: var(--md-on-surface); }
  .avatar[data-kind="svg"] svg { width: 100%; height: 100%; display: block; fill: currentColor; }
  /* 主题头像框：官方惯例是比头像更大的装饰图叠在上面，不参与裁剪 */
  .avatar .frame {
    position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
    transform: translate(-50%, -50%) scale(var(--avatar-frame-scale, 1.7));
    pointer-events: none; object-fit: contain;
  }
  /* 内容层单独一层：生成中形状自转时靠它反向抵消，文字与图片保持正立 */
  .avatar-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  /* 生成中：原生 rememberAvatarShape 让 Cookie6Sided 形状 3s 线性自转一圈 */
  .avatar.loading { animation: avatar-spin 3s linear infinite; will-change: transform; }
  .avatar.loading .avatar-inner { animation: avatar-spin-counter 3s linear infinite; }
  .avatar.loading .frame { animation: avatar-frame-counter 3s linear infinite; }
  @keyframes avatar-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes avatar-spin-counter { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  @keyframes avatar-frame-counter {
    from { transform: translate(-50%, -50%) scale(var(--avatar-frame-scale, 1)) rotate(0deg); }
    to { transform: translate(-50%, -50%) scale(var(--avatar-frame-scale, 1)) rotate(-360deg); }
  }

  /* col 必须占满：否则操作排的固有宽度会把正文一起挤窄（原生正文是 fillMaxWidth） */
  .col { display: flex; flex-direction: column; gap: var(--row-gap); width: 100%; min-width: 0; }
  .row.user .col { align-items: flex-end; }
  .row.ai .col { align-items: flex-start; }
  .body { display: flex; flex-direction: column; gap: var(--row-gap); width: 100%; min-width: 0; }
  .blk { max-width: 100%; }
  /* 气泡贴合内容宽度，卡片/思考块铺满（原生语义） */
  .blk.bubble { align-self: flex-start; }
  .row.user .blk.bubble { align-self: flex-end; }

  /* —— 气泡 —— */
  .bubble {
    position: relative;
    background: var(--bubble-ai, var(--md-surface-container-high));
    color: var(--md-on-surface);
    border-radius: var(--bubble-radius);
    padding: var(--bubble-pad-y) var(--bubble-pad-x);
    overflow-wrap: anywhere;
    border: var(--bubble-border-width, 0px) solid var(--bubble-border-color, transparent);
    box-shadow: var(--bubble-shadow, none);
    background-size: var(--bubble-image-size, contain);
    background-repeat: no-repeat;
    background-position: center;
  }
  .row.user .bubble {
    background: var(--bubble-user, var(--md-primary-container));
    color: var(--md-on-primary-container);
    background-image: var(--bubble-user-image, none);
  }
  .row.ai .bubble { background-image: var(--bubble-ai-image, none); }
  body.bubble-image-overlay .bubble { background-blend-mode: multiply; }
  /* 助手气泡可按设置关掉：正文平铺 */
  body.hide-ai-bubble .row.ai .bubble {
    background: transparent; box-shadow: none; border-color: transparent;
    padding-left: 0; padding-right: 0; border-radius: 0;
  }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }

  /* —— 打字光标：只在助手流式消息上 —— */
  .bubble.typing::after {
    content: "▍"; margin-left: 1px;
    color: var(--md-primary);
    animation: blink 1s steps(1, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 生成中的动态指示：与原生一致的呼吸圆点 */
  .gen-dots { display: inline-flex; align-items: center; gap: 4px; height: 18px; }
  .gen-dots i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--md-primary);
    animation: genPulse 1.2s ease-in-out infinite;
  }
  .gen-dots i:nth-child(2) { animation-delay: .15s; }
  .gen-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes genPulse { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }

  /* —— 思考块：ChainOfThought 卡片，默认折叠 —— */
  details.blk-reasoning {
    width: 100%;
    background: var(--md-reasoning-bg, var(--md-surface-container-high));
    border-radius: var(--think-radius);
    padding: var(--think-pad-y) var(--think-pad-x);
  }
  .reasoning-head {
    display: flex; align-items: center; gap: 8px;
    min-height: 32px; padding: 8px 0;
    color: var(--md-secondary); font-size: 14px; line-height: 20px;
    cursor: pointer; list-style: none;
  }
  .reasoning-head::-webkit-details-marker { display: none; }
  .reasoning-head .ico { flex: 0 0 16px; width: 16px; height: 16px; }
  .reasoning-head .dur { font-size: 11px; line-height: 16px; opacity: .8; }
  .reasoning-head .arrow { margin-left: auto; flex: 0 0 16px; width: 16px; height: 16px; transition: transform .18s; }
  details[open] > .reasoning-head .arrow { transform: rotate(180deg); }
  .reasoning-body {
    margin: 0 0 8px var(--think-indent);
    font-size: 12px; line-height: 16px;
    white-space: pre-wrap; overflow-wrap: anywhere;
    color: var(--md-reasoning-color, var(--md-on-surface-variant));
    max-height: var(--think-preview); overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 60%, transparent);
  }
  details[open] > .reasoning-body { max-height: none; -webkit-mask-image: none; }

  /* —— 工具调用块：同一套卡片，原生步骤默认展开 —— */
  details.blk-tool {
    width: 100%;
    background: var(--md-surface-container-high);
    border-radius: var(--think-radius);
    padding: var(--think-pad-y) var(--think-pad-x);
  }
  .tool-head {
    display: flex; align-items: center; gap: 8px;
    min-height: 32px; padding: 8px 0;
    color: var(--md-secondary); font-size: 14px; line-height: 20px;
    cursor: pointer; list-style: none;
  }
  .tool-head::-webkit-details-marker { display: none; }
  .tool-head .ico { flex: 0 0 16px; width: 16px; height: 16px; }
  .tool-head .arrow { margin-left: auto; flex: 0 0 16px; width: 16px; height: 16px; transition: transform .18s; }
  details[open] > .tool-head .arrow { transform: rotate(180deg); }
  .tool-body {
    margin: 0 0 8px var(--think-indent);
    font-family: ui-monospace, "Noto Sans Mono CJK SC", monospace;
    font-size: 12px; line-height: 16px;
    color: var(--md-on-surface-variant);
    overflow-x: auto; white-space: pre-wrap;
  }

  /* —— 技术统计行（ChatMessageNerdLine：labelSmall + secondary α.5）—— */
  .nerd {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding: 0 4px; font-size: 11px; line-height: 16px;
    color: var(--md-secondary); opacity: .5;
    font-variant-numeric: tabular-nums;
  }
  .nerd[hidden] { display: none; }
  .nerd .item { display: inline-flex; align-items: center; gap: 1px; }
  .nerd .item svg { width: 12px; height: 12px; }

  /* —— 时间（labelSmall + onSurfaceVariant α.6，在操作行末尾）—— */
  .time { font-size: 11px; line-height: 16px; color: var(--md-on-surface-variant); opacity: .6; padding: 0 4px; }
  .time[hidden] { display: none; }

  /* —— 消息操作排：常驻在气泡下方，点击经桥回原生 VM —— */
  .ops { display: flex; align-items: center; gap: 4px; width: 100%; min-width: 0; padding: 0 2px; flex-wrap: wrap; }
  .row.user .ops { justify-content: flex-end; }
  .ops[hidden] { display: none; }
  .op {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    width: 32px; height: 32px; padding: 0; border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--md-on-surface-variant); cursor: pointer; flex: 0 0 auto;
  }
  .op svg { width: 18px; height: 18px; display: block; }
  .op:active { background: var(--md-surface-container-high); }
  .op.on { color: var(--md-primary); }
  .op[disabled] { opacity: .35; }

  /* —— 多分支切换条：图标 16dp + 8dp 内边距（触区 32dp），页码 bodySmall —— */
  .swipes { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .row.user .swipes { flex-direction: row-reverse; }
  .swipe-btn {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    color: var(--md-on-surface-variant); font: inherit; font-size: 16px; line-height: 1;
    min-width: 32px; min-height: 32px; padding: 8px; border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .swipe-btn:disabled { opacity: .5; }
  .swipe-btn:active { background: var(--md-surface-container-high); }
  .swipe-label {
    font-size: 14px; color: var(--md-on-surface-variant);
    font-variant-numeric: tabular-nums;
  }

  /* —— 附件：消息 part 图片固定 72dp 高、圆角 12dp —— */
  .attach { display: flex; flex-wrap: wrap; gap: 4px; }
  .attach[hidden] { display: none; }
  .attach-img { height: 72px; width: auto; max-width: 100%; border-radius: 12px; display: block; object-fit: cover; }
  .attach-media { max-width: 100%; border-radius: 12px; display: block; }
  .attach-doc {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 22px;
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container); font-size: 14px;
  }

  /* —— 翻译块 —— */
  /* 对齐原生 CollapsibleTranslationText：分隔线 + 标题行 + 可折叠卡 */
  .translation { margin-top: 12px; }
  .translation .tr-rule { height: 1px; background: var(--md-outline, var(--md-outline-variant, #79747e)); opacity: .3; margin: 8px 0; }
  .translation .tr-head { display: flex; align-items: center; justify-content: space-between; }
  .translation .tr-title { display: inline-flex; align-items: center; gap: 8px; color: var(--md-primary); font-weight: 600; font-size: 14px; }
  .translation .tr-title svg { width: 16px; height: 16px; }
  .translation .tr-toggle { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; color: var(--md-on-surface-variant); }
  .translation .tr-toggle svg { width: 16px; height: 16px; transition: transform .2s ease; }
  .translation.collapsed .tr-toggle svg { transform: rotate(180deg); }
  .translation .tr-card { position: relative; margin-top: 8px; padding: 12px; border-radius: 12px; overflow: hidden; }
  .translation .tr-card::before { content: ''; position: absolute; inset: 0; background: var(--md-primary-container); opacity: .3; }
  .translation .tr-card > * { position: relative; }
  .translation.collapsed .tr-card { display: none; }
  .translation .tr-loading { display: flex; align-items: center; gap: 8px; }
  .translation .tr-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--md-primary); border-top-color: transparent; animation: tr-spin .8s linear infinite; }
  @keyframes tr-spin { to { transform: rotate(360deg); } }

  /* —— 前端卡：整体交给内层 iframe，父页面只负责占位与高度 —— */
  .card { width: 100%; max-width: 100%; }
  .card-frame {
    width: 100%; border: 0; display: block; background: transparent;
    touch-action: pan-y;
  }

  /* —— Markdown 排版 —— */
  h1, h2, h3, h4, h5, h6 { margin: var(--block-gap) 0 calc(var(--block-gap) * .4); line-height: 1.25; font-weight: 700; }
  h1 { font-size: 1.5em; } h2 { font-size: 1.375em; } h3 { font-size: 1.25em; }
  h4 { font-size: 1.125em; } h5 { font-size: 1em; } h6 { font-size: .875em; }
  p { margin: var(--block-gap) 0; }
  ul, ol { margin: var(--block-gap) 0; padding-left: 1.4em; }
  li { margin: calc(var(--block-gap) / 3) 0; }
  blockquote {
    margin: var(--block-gap) 0; padding: 0 0 0 12px;
    background: var(--md-quote-bg, transparent);
    border-left: var(--md-quote-accent, 3px) solid var(--md-quote-border, var(--md-outline-variant));
    border-radius: var(--md-quote-radius, 0);
    color: var(--quote-color, var(--md-on-surface-variant));
  }
  code {
    font-family: ui-monospace, "Noto Sans Mono CJK SC", monospace; font-size: .9em;
    background: var(--md-inline-code-bg, transparent);
    color: var(--md-inline-code-color, var(--md-primary));
    padding: 0 4px; border-radius: var(--md-inline-code-radius, 6px);
  }
  /* 代码块外框：1dp outlineVariant + 12dp 圆角，头部条 + 代码区（对齐 HighlightCodeBlock） */
  pre {
    background: var(--md-code-bg, var(--md-surface-container));
    color: var(--md-code-color, inherit);
    border: 1px solid var(--md-code-border-color, var(--md-outline-variant));
    border-radius: var(--md-code-radius, 12px);
    margin: var(--block-gap) 0; overflow: hidden;
  }
  pre > .code-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--md-surface-container-highest);
    color: var(--md-on-surface-variant);
    font-size: 12px; line-height: 12px;
  }
  pre > .code-head .lang { font-family: ui-monospace, monospace; opacity: .5; }
  pre > .code-head .spacer { flex: 1 1 auto; }
  pre > .code-head .copy {
    appearance: none; border: 0; background: transparent;
    color: inherit; opacity: .5; padding: 4px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  pre > .code-head .copy:active { opacity: 1; }
  pre > .code-head .copy svg { width: 16px; height: 16px; display: block; }
  pre > code {
    display: block; overflow-x: auto;
    background: none; padding: 8px 12px;
    font-size: 12px; line-height: 16px; border-radius: 0;
  }
  body.code-wrap pre > code { white-space: pre-wrap; word-break: break-word; }
  pre.collapsed > code { max-height: calc(16px * 10); overflow: hidden; }
  pre > .expand {
    appearance: none; border: 0; width: 100%; padding: 6px;
    background: var(--md-surface-container-highest); color: var(--md-primary);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  table { border-collapse: collapse; max-width: 100%; display: block; overflow-x: auto; margin: var(--block-gap) 0; }
  th, td { border: 1px solid var(--md-outline-variant); padding: 6px 10px; }
  img, video { max-width: 100%; height: auto; border-radius: 8px; }
  a { color: var(--md-primary); text-decoration: none; }
  hr { border: 0; border-top: 1px solid var(--md-outline-variant); margin: var(--block-gap) 0; }
  mark { background: var(--md-mark-bg, rgba(255, 235, 59, .4)); color: var(--md-mark-color, inherit); border-radius: 3px; }
  em, i { color: var(--italics-color, inherit); }
  /* 卡片与模型常用 <span style> 上色；引号与括号另配色（enableTextColor 控制） */
  u { text-decoration-color: var(--underline-color, currentColor); }
  .chara-tag { font-weight: inherit; }
  /* 引号/括号染色（enableTextColor 打开时由渲染器加 class） */
  .q { color: var(--quote-color, inherit); }
  .b { color: var(--bracket-color, inherit); }

  /* —— 空态 —— */
  .empty {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 55vh; padding: 0 24px;
    color: var(--md-on-surface-variant); opacity: .6;
  }

  /* —— 跳到底部按钮：贴在原生输入栏上方 8dp（原生 MessageJumper 的 padding(8.dp)）—— */
  #jump {
    position: fixed; right: 16px; bottom: calc(var(--safe-bottom, 0px) + 8px);
    width: 40px; height: 40px; border: 0; border-radius: 20px;
    background: var(--md-surface-container-high); color: var(--md-on-surface);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
    display: flex; align-items: center; justify-content: center; z-index: 5;
  }
  #jump[hidden] { display: none; }
  #jump.left { right: auto; left: 16px; }
  #jump svg { width: 20px; height: 20px; }

  /* 底部工具条由原生输入栏提供，页面里永不渲染 */
  #toolbar { display: none !important; }
  .rikka-block { display: block; margin: 6px 0; }
  .rikka-block-option { padding: 8px 10px; border-radius: 12px; background: var(--md-surface-container); }
  .rikka-block-statusblock { font-size: 13px; }
</style>
</head>
<body>
  <div id="scroller"><div id="list"></div></div>
  <button type="button" id="jump" hidden aria-label="跳到最新">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 5v14"></path><path d="m6 13 6 6 6-6"></path>
    </svg>
  </button>

     卡片脚本一抛错就整张白屏；file:// 同目录相对路径加载最稳，不依赖原生下发时序 -->
<script src="compat.js"></script>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
