<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>rikkaST Tavern Runtime</title>
    <!-- 经典库（对齐 SillyTavern 1.18 的加载序：jQuery → toastr；lodash 供 window._） -->
    <script src="./vendor/lib/jquery-3.5.1.min.js"></script>
    <script src="./vendor/lib/lodash.min.js"></script>
    <script src="./vendor/lib/toastr.min.js"></script>
    <!-- EJS 模板引擎（ST-Prompt-Template 同款 browserify 包，供 EJS 提示词渲染） -->
    <script src="./vendor/lib/ejs.umd.js"></script>
    <!-- Vue 3 / Vue Router（MVU 面板 UI 所需，隐藏 iframe 使用） -->
    <script src="./vendor/lib/vue.runtime.global.prod.js"></script>
    <script src="./vendor/lib/vue-router.global.prod.js"></script>
    <!-- [v235 R2] KaTeX 0.16.45（MIT，本地 vendored，离线）：消息/面板里的 $$..$$ 与 \(..\) 渲染 -->
    <link rel="stylesheet" href="./vendor/katex/katex.min.css">
    <script src="./vendor/katex/katex.min.js"></script>
    <!-- 统一扩展弹窗与常驻悬浮窗暗色高对比样式（当主运行时 WebView 挂载到聊天页悬浮窗时直接生效） -->
    <link rel="stylesheet" href="./extension-settings.css">
</head>
<body>
    <div id="st-runtime-root" style="display:none"></div>
    <!-- 批次十七：ST 兼容 DOM 容器。第三方扩展把设置界面 append 到这些节点上。
         平时在后台保持隐藏；当用户在聊天页点击右侧悬浮窗切换至「记忆表格 / 小白X / 扩展面板」时动态展示。 -->
    <div id="rikka-st-compat-dom" style="display:none" aria-hidden="true">
        <div id="top-settings-holder"></div>
        <div id="extensions_settings"></div>
        <div id="extensions_settings2"></div>
        <div id="extensionsMenu"></div>
        <div id="extensions_menu"></div>
        <div id="extensions-settings-button"></div>
        <div id="translation_container"></div>
        <div id="extensions_details"></div>
        <div id="mvu-standalone-buttons"></div>
        <div id="user-settings-block"></div>
        <div id="rikka-ext-workbench-root"></div>
    </div>
    <div id="rikka-hidden-st-stubs" style="display:none !important;" aria-hidden="true">
        <div id="form_sheld" style="display:none !important;">
            <div id="send_form" style="display:none !important;">
                <textarea id="send_textarea" style="display:none !important;"></textarea>
            </div>
        </div>
        <div id="chat" style="display:none !important;"></div>
    </div>
    <!-- [v212 · §5.F] highlight.js 11.9.0（BSD-3，真库，来自 Rikkahub-Revised assets）必须在 third-party-globals.js 之前加载 -->
    <script src="./vendor/lib/hljs.min.js"></script>
    <link rel="stylesheet" href="./vendor/lib/hljs-theme.css">
    <script src="./vendor/lib/third-party-globals.js"></script>
    <!-- [v209] select2 4.1.0（MIT/GPL，ST 自带同款） -->
    <link rel="stylesheet" href="./vendor/lib/select2.min.css">
    <link rel="stylesheet" href="./vendor/lib/select2-overrides.css">
    <script src="./vendor/lib/select2.min.js"></script>
    <script src="./vendor/lib/select2-search-placeholder.js"></script>
    <script type="module" src="./runtime.js"></script>
</body>
</html>
